# Corre las mismas pruebas que tu servidor, en GitHub, cada vez que se sube un cambio.
# Así se ve el motivo exacto si alguna falla, antes de que llegue al servidor.
# Es gratis en repositorios públicos. No despliega nada ni toca el servidor.
name: Pruebas
on:
  push:
    branches: [desarrollo]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --no-warnings --test test/*.test.js
