# Corre las mismas pruebas que tu servidor, en GitHub, cada vez que se sube un cambio.
# Así se ve el motivo exacto si alguna falla, antes de que llegue al servidor.
# Es gratis en repositorios públicos. No despliega nada ni toca el servidor.
name: Pruebas
on:
  push:
    branches: [desarrollo, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --no-warnings --test test/*.test.js

  # Fase 1, parte f: los programas del servidor (deploy/*.sh). En SIMULACIÓN: una raíz falsa con comandos falsos
  # (test/raiz-falsa.js) y, al final, un contenedor Ubuntu desechable (apt, useradd y Node de verdad; systemd, ufw,
  # Tailscale y GitHub de mentira). No toca ningún servidor y no usa ninguna clave.
  instalador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Escritura de cada programa (bash -n)
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning -x deploy/*.sh
      - name: Ensayo del instalador en raíz falsa
        run: node --no-warnings test/ensayo-instalar.mjs
      - name: Lo mismo, como root (las pruebas bajan a «nobody» con setpriv)
        run: |
          sudo mkdir -m 711 /tmp/oportia-ci && sudo cp -r . /tmp/oportia-ci/src && sudo mkdir -m 755 /tmp/oportia-ci/t
          cd /tmp/oportia-ci/src && sudo env "PATH=$PATH" TMPDIR=/tmp/oportia-ci/t node --no-warnings --test test/actualizador.test.js test/instalar.test.js
      - name: Ensayo en un contenedor Ubuntu desechable (instalar dos veces, actualizar, volver atrás y recuperar)
        run: bash test/ensayo-contenedor.sh ubuntu:24.04
