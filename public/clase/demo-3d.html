<!doctype html>
<html lang="es" data-tema="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Escenas 3D · galería</title>
  <link rel="stylesheet" href="clase.css">
  <script type="module" src="demo-3d.js"></script>
</head>
<body class="clase-raiz demo-cuerpo">
  <header class="demo-cabeza">
    <div>
      <p class="demo-antetitulo">Academia de aviación · prueba</p>
      <h1>Escenas 3D</h1>
      <p class="demo-lema">Espacio aéreo, mínimos VFR, circuito, frentes, pérdida y VOR: cada una guiada por pasos (el JSON va debajo).</p>
    </div>
    <div class="demo-tema" role="group" aria-label="Tema">
      <button type="button" class="clase-boton" data-tema="claro">Claro</button>
      <button type="button" class="clase-boton" data-tema="oscuro">Oscuro</button>
      <button type="button" class="clase-boton" data-idioma="es">ES</button>
      <button type="button" class="clase-boton" data-idioma="en">EN</button>
    </div>
  </header>
  <main class="demo-galeria" id="galeria"></main>
  <footer class="demo-pie"><p>Página de prueba: no forma parte de la app.</p></footer>
</body>
</html>
