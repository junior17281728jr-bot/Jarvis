<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPORTIA</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e8edf7;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
.c{max-width:520px;text-align:center}h1{letter-spacing:.3em;font-size:34px;margin:0 0 8px}p{color:#9fb0cc}</style></head>
<body><div class="c"><h1>OPORTIA</h1><p>En construcción.</p></div>
<script>
// Quita la app vieja de JARVIS que el navegador tenía guardada
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
</script></body></html>
